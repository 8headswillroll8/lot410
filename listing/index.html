<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/lot410/assets/icons/gavel.svg"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../src/style.css" />

    <title>Lot410 | Listings</title>
  </head>

  <body>
    <header></header>

    <main class="min-h-screen w-full">
      <!-- Alert messages -->
      <div
        class="hidden items-start gap-2"
        id="listing-alert"
        aria-live="polite"
      >
        <img
          id="listing-icon"
          class="mt-1 w-7 md:mt-2"
          src="/lot410/assets/icons/awkward.svg"
          alt=""
        />

        <p id="listing-alert-text">
          Well, this is awkward. We couldn't load the listing. Try again.
        </p>
      </div>

      <article
        id="single-listing"
        class="mb-8 flex flex-col md:flex-row md:items-start"
      ></article>

      <section id="bidding-activity" class="mb-15 text-center"></section>
    </main>

    <!-- Footer -->
    <footer
      class="flex flex-col gap-12 px-6 py-6 text-brand xl:grid xl:min-h-80 xl:grid-cols-12 xl:gap-x-6"
    ></footer>

    <script type="module" src="../src/pages/listing.ts"></script>
  </body>
</html>
