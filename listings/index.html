<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/lot410/assets/icons/gavel.svg"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../src/style.css" />

    <title>Lot410 | Listings</title>
  </head>

  <body>
    <header></header>

    <main class="min-h-screen w-full">
      <h1 class="mb-12 text-center lg:mb-18">Auctions</h1>

      <!-- Search -->
      <div id="search-bar" class="mx-6"></div>

      <!-- Filter -->
      <div class="mb-3 flex flex-col xl:mb-5 xl:flex-row">
        <div
          class="mx-6 mb-4 grid grid-cols-2 gap-2 sm:grid-cols-3 xl:mx-auto xl:grid-cols-5"
        >
          <button
            type="button"
            aria-pressed="true"
            class="listing-control min-w-30 rounded-full border-2 border-brand bg-brand text-white hover:bg-brand hover:text-white lg:px-6"
            data-filter="all"
          >
            View all
          </button>

          <button
            type="button"
            aria-pressed="false"
            class="listing-control min-w-30 rounded-full border-2 border-brand hover:bg-brand hover:text-white lg:px-6"
            data-filter="hot"
          >
            Hot
          </button>

          <button
            type="button"
            aria-pressed="false"
            class="listing-control min-w-30 rounded-full border-2 border-brand hover:bg-brand hover:text-white lg:px-6"
            data-filter="steals"
          >
            Steals
          </button>

          <button
            type="button"
            aria-pressed="false"
            class="listing-control min-w-30 rounded-full border-2 border-brand hover:bg-brand hover:text-white lg:px-6"
            data-filter="no-bids"
          >
            No bids
          </button>

          <button
            type="button"
            aria-pressed="false"
            class="listing-control min-w-30 rounded-full border-2 border-brand hover:bg-brand hover:text-white lg:px-6"
            data-filter="ending"
          >
            Ending soon
          </button>
        </div>
      </div>

      <!-- Grid -->
      <section
        id="listings-grid"
        class="mb-8 grid grid-cols-1 gap-y-8 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4"
      ></section>

      <div id="listings-alert" class="hidden mx-6" aria-live="polite"></div>

      <nav class="flex justify-center gap-10" aria-label="Pagination">
        <button
          class="listing-pagination underline-offset-6 hover:underline"
          type="button"
          data-page="1"
        >
          1
        </button>

        <button
          class="listing-pagination underline-offset-6 hover:underline"
          type="button"
          data-page="2"
        >
          2
        </button>

        <button
          class="listing-pagination underline-offset-6 hover:underline"
          type="button"
          data-page="3"
        >
          3
        </button>
      </nav>
    </main>

    <footer
      class="flex flex-col gap-12 px-6 py-6 text-brand xl:grid xl:min-h-80 xl:grid-cols-12 xl:gap-x-6"
    ></footer>

    <script type="module" src="../src/pages/listings.ts"></script>
  </body>
</html>
