<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="../src/assets/icons/gavel.svg"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../src/style.css" />
    <title>Lot410 | Listings</title>
  </head>

  <body>
    <header></header>

    <main class="min-h-screen w-full">
      <h1 class="text-center mb-12 lg:mb-18">Auctions</h1>
      <!-- Search -->
      <div class="mx-6">
        <form
          class="flex items-center mx-auto mb-8 gap-3 border-b-2 max-w-100 border-brand lg:mb-12"
        >
          <img class="w-6" src="../src/assets/icons/search.svg" alt="" />
          <label for="listings-search" class="sr-only">Search</label>
          <input
            class="flex-1 bg-transparent outline-none placeholder:text-brand"
            type="search"
            id="listings-search"
            name="listings-search"
            placeholder="Search"
          />
          <button type="submit" aria-label="Search">
            <img class="w-6" src="../src/assets/icons/arrow-right.svg" alt="" />
          </button>
        </form>
      </div>
      <!-- Filter -->
      <div class="flex flex-col mb-3 xl:flex-row xl:justify-between xl:mb-6">
        <div
          class="grid grid-cols-2 sm:grid-cols-3 gap-2 mx-6 mb-4 xl:grid-cols-6"
        >
          <button
            type="button"
            aria-pressed="true"
            class="min-w-30 border-2 rounded-full hover:bg-brand hover:border-brand hover:text-white lg:px-6"
          >
            View all
          </button>
          <button
            type="button"
            aria-pressed="false"
            class="min-w-30 border-2 rounded-full hover:bg-brand hover:border-brand hover:text-white lg:px-6"
          >
            Furniture
          </button>
          <button
            type="button"
            aria-pressed="false"
            class="min-w-30 border-2 rounded-full hover:bg-brand hover:border-brand hover:text-white lg:px-6"
          >
            Tech
          </button>
          <button
            type="button"
            aria-pressed="false"
            class="min-w-30 border-2 rounded-full hover:bg-brand hover:border-brand hover:text-white lg:px-6"
          >
            Clothing
          </button>
          <button
            type="button"
            aria-pressed="false"
            class="min-w-30 border-2 rounded-full hover:bg-brand hover:border-brand hover:text-white lg:px-6"
          >
            Plants
          </button>
          <button
            type="button"
            aria-pressed="false"
            class="min-w-30 border-2 rounded-full hover:bg-brand hover:border-brand hover:text-white lg:px-6"
          >
            Other
          </button>
        </div>

        <!-- Sort -->
        <div class="flex justify-end relative mx-6">
          <label for="listings-sort-by" class="sr-only">Sort by</label>

          <select
            name="listings-sort-by"
            id="listings-sort-by"
            class="appearance-none pr-7 text-brand outline-none lg:pr-9"
          >
            <option value="">Sort by</option>
            <option value="ending-soon">Ending soon</option>
            <option value="newest">Newest</option>
            <option value="most-bids">Most bids</option>
            <option value="highest-bid">Highest bid</option>
            <option value="lowest-bid">Lowest bid</option>
          </select>

          <img
            class="absolute right-0 top-1 pointer-events-none xl:right-2.25 xl:top-4"
            src="../src/assets/icons/arrow-down.svg"
            alt=""
          />
        </div>
      </div>
      <!-- Grid -->
      <section
        id="listings-grid"
        class="grid grid-cols-1 gap-y-8 mb-8 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4"
      ></section>

      <!-- Alert messages -->
      <div class="hidden items-start gap-2" id="listings-alert">
        <img
          id="listings-icon"
          class="mt-1 w-7 md:mt-2"
          src="../src/assets/icons/awkward.svg"
          alt=""
        />
        <p id="listings-alert-text">
          Well, this is awkward. We couldn't load the listings. Try again.
        </p>
      </div>
    </main>

    <!-- Footer -->
    <footer
      class="flex flex-col gap-12 px-6 py-6 text-brand xl:grid xl:min-h-80 xl:grid-cols-12 xl:gap-x-6"
    ></footer>

    <script type="module" src="../src/pages/listings.ts"></script>
  </body>
</html>
