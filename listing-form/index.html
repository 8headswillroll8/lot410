<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/lot410/assets/icons/gavel.svg"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../src/style.css" />

    <title>Lot410 | List something</title>
  </head>

  <body>
    <header></header>

    <main
      class="mx-auto my-20 flex min-h-screen w-full max-w-150 flex-col px-6"
    >
      <h1 class="mb-9 text-center text-[82px] leading-20 md:text-[92px]">
        New listing
      </h1>

      <form class="listing-form flex flex-col gap-5" novalidate></form>

      <!-- Alert messages -->
      <div
        class="hidden items-start gap-2 pt-3"
        id="listing-form-alert"
        aria-live="polite"
      >
        <img
          id="listing-form-icon"
          class="mt-1 w-7 md:mt-2"
          src="/lot410/assets/icons/alert-circle.svg"
          alt=""
        />

        <p id="listing-form-alert-text">Something went wrong. Try again.</p>
      </div>
    </main>

    <!-- Footer -->
    <footer
      class="flex flex-col gap-12 px-6 py-6 text-brand xl:grid xl:min-h-80 xl:grid-cols-12 xl:gap-x-6"
    ></footer>

    <script type="module" src="../src/pages/listing-form.ts"></script>
  </body>
</html>
