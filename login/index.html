<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/lot410/assets/icons/gavel.svg"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../src/style.css" />

    <title>Lot410 | Login</title>
  </head>

  <body class="flex min-h-screen flex-col">
    <header></header>

    <main class="flex flex-1 justify-center pt-28 md:pt-32">
      <div class="flex w-full max-w-87.5 flex-col items-center">
        <h1 class="mb-9 text-[82px] md:text-[92px]">Login</h1>

        <form
          id="login-form"
          class="login-form flex w-full flex-col gap-8"
          novalidate
        >
          <!-- email -->
          <div
            class="flex gap-4 border-b-2 border-brand pb-2 focus-within:border-dashed"
          >
            <img class="w-6" src="/lot410/assets/icons/mail.svg" alt="" />

            <label for="login-email" class="sr-only">Email</label>

            <div class="flex-1">
              <input
                class="login-email w-full outline-none placeholder:text-brand"
                type="email"
                id="login-email"
                name="login-email"
                placeholder="Email"
                required
              />
            </div>
          </div>

          <!-- password -->
          <div
            class="flex gap-4 border-b-2 border-brand pb-2 focus-within:border-dashed"
          >
            <img class="w-6" src="/lot410/assets/icons/lock.svg" alt="" />

            <label for="login-password" class="sr-only"> Password </label>

            <div class="flex-1">
              <input
                class="login-password w-full outline-none placeholder:text-brand"
                type="password"
                id="login-password"
                name="login-password"
                placeholder="Password"
                required
              />
            </div>
          </div>

          <button
            type="submit"
            class="h-12.5 rounded-full bg-brand text-white hover:rounded-none"
            id="login-button"
          >
            Login
          </button>

          <div
            id="login-alert"
            class="hidden justify-center"
            aria-live="polite"
          ></div>
        </form>
      </div>
    </main>

    <script type="module" src="../src/pages/login.ts"></script>
  </body>
</html>
