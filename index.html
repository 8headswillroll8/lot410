<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./src/assets/icons/gavel.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/style.css" />
    <title>Lot410 | Online student auction</title>
  </head>

  <body>
    <section id="hero-scroll-section" class="relative h-[350vh]">
      <div class="sticky top-0 flex min-h-screen flex-col overflow-hidden">
        <header id="header"></header>

        <main class="relative flex-1 overflow-hidden">
          <h1
            class="mx-auto my-6 w-full max-w-205.5 text-center text-[108px] leading-none md:mt-30 md:text-[158px]"
          >
            Going once, going twice.
          </h1>

          <div
            class="mt-12 flex flex-col gap-8 px-6 sm:mt-16 md:mt-50 md:flex-row md:justify-center lg:gap-100"
          >
            <p class="max-w-84.5">
              A student auction for furniture, tech & things worth passing on
            </p>

            <p class="max-w-84.5 self-end text-right">
              See something worth keeping, make it yours with a bid.
            </p>
          </div>

          <div
            id="hero-carousel"
            class="absolute top-10 flex gap-50 md:gap-100 md:top-40"
          >
            <img
              class="h-100 w-auto shrink-0 lg:h-150"
              src="./src/assets/images/hero-rocking-horse.webp"
              alt="Rocking horse"
            />

            <img
              class="h-100 w-auto shrink-0 lg:h-150"
              src="./src/assets/images/hero-chair.webp"
              alt="Chair with leather seat"
            />

            <img
              class="h-100 w-auto shrink-0 lg:h-150"
              src="./src/assets/images/hero-books.webp"
              alt="Stack of books"
            />

            <img
              class="h-100 w-auto shrink-0 lg:h-150"
              src="./src/assets/images/hero-plant.webp"
              alt="Green plant in a pot"
            />

            <img
              class="h-100 w-auto shrink-0 lg:h-150"
              src="./src/assets/images/hero-lamp.webp"
              alt="Ceramic lamp with shade"
            />
          </div>
        </main>
      </div>
    </section>

    <footer
      class="flex flex-col gap-12 px-6 py-6 text-brand xl:grid xl:min-h-80 xl:grid-cols-12 xl:gap-x-6"
    ></footer>

    <script type="module" src="./src/pages/home.ts"></script>
  </body>
</html>
