<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="../src/assets/icons/gavel.svg"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../src/style.css" />
    <title>Lot410 | Register</title>
  </head>

  <body class="flex min-h-screen flex-col">
    <header></header>

    <main class="flex flex-1 justify-center pt-28 md:pt-32">
      <div class="flex w-full max-w-87.5 flex-col items-center">
        <h1 class="mb-9 text-[82px] md:text-[92px]">Register</h1>

        <form id="register-form" class="flex w-full flex-col gap-8" novalidate>
          <!-- username -->
          <div
            class="flex gap-4 border-b-2 border-brand pb-2 focus-within:border-dashed"
          >
            <img class="w-6" src="../src/assets/icons/user.svg" alt="" />

            <label for="register-username" class="sr-only">Username</label>

            <div class="flex-1">
              <input
                class="w-full placeholder:text-brand"
                type="text"
                id="register-username"
                name="register-username"
                placeholder="Create a username"
                required
              />
            </div>
          </div>

          <!-- email -->
          <div
            class="flex gap-4 border-b-2 border-brand pb-2 focus-within:border-dashed"
          >
            <img class="w-6" src="../src/assets/icons/mail.svg" alt="" />

            <label for="register-email" class="sr-only">Email</label>

            <div class="flex-1">
              <input
                class="w-full placeholder:text-brand"
                type="email"
                id="register-email"
                name="register-email"
                placeholder="Your student email"
                required
              />
            </div>
          </div>

          <!-- password -->
          <div
            class="flex gap-4 border-b-2 border-brand pb-2 focus-within:border-dashed"
          >
            <img class="w-6" src="../src/assets/icons/lock.svg" alt="" />

            <label for="register-password" class="sr-only"> Password </label>

            <div class="flex-1">
              <input
                class="w-full placeholder:text-brand"
                type="password"
                id="register-password"
                name="register-password"
                placeholder="Create a password"
                required
              />
            </div>
          </div>

          <!-- confirm password -->
          <div
            class="flex gap-4 border-b-2 border-brand pb-2 focus-within:border-dashed"
          >
            <img class="w-6" src="../src/assets/icons/lock.svg" alt="" />

            <label for="register-confirm-password" class="sr-only">
              Confirm password
            </label>

            <div class="flex-1">
              <input
                class="w-full placeholder:text-brand"
                type="password"
                id="register-confirm-password"
                name="register-confirm-password"
                placeholder="Repeat your password"
                required
              />
            </div>
          </div>

          <button
            class="h-12.5 rounded-full bg-brand text-white hover:rounded-none"
            id="register-button"
          >
            Register
          </button>

          <!-- validation messages -->
          <div
            class="gap-2 justify-center items-start hidden"
            id="register-alert"
          >
            <img
              id="register-icon"
              class="w-7 mt-1 md:mt-2"
              src="../src/assets/icons/alert-circle.svg"
              alt=""
            />
            <p id="register-alert-text"></p>
          </div>
        </form>
      </div>
    </main>

    <script type="module" src="../src/pages/register.ts"></script>
  </body>
</html>
